<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NESTOR: PLANET EATER ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&display=swap');
        body { margin: 0; background: #000; color: #fff; font-family: 'JetBrains Mono', monospace; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn { 
            pointer-events: auto; padding: 10px 5px; flex: 1; border-radius: 2px;
            font-size: 9px; font-weight: 800; text-transform: uppercase; transition: 0.1s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:active { transform: scale(0.95); background: #fff; color: #000; }
        .btn:disabled { opacity: 0.1; }
    </style>
</head>
<body>

    <div class="fixed top-0 left-0 w-full p-4 flex justify-between pointer-events-none z-10">
        <div class="glass p-2">
            <div class="text-[7px] opacity-50 uppercase leading-none mb-1">Кредиты</div>
            <div class="text-xl font-black text-green-400">$<span id="money">0</span></div>
        </div>
        <div class="glass p-2 text-right">
            <div id="planetName" class="text-sm font-black italic tracking-tighter uppercase leading-none mb-1">МЕРКУРИЙ</div>
            <div class="w-32 h-1 bg-white/10 rounded-full overflow-hidden">
                <div id="hpBar" class="h-full bg-white transition-all duration-75" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full p-4 z-10 flex gap-2">
        <button id="buyUnit" class="btn">➕ Жнец ($<span id="uCost">50</span>)</button>
        <button id="buyDmg" class="btn">🔥 Сила ($<span id="dCost">100</span>)</button>
        <button id="buySpd" class="btn">⚡ Скорость ($<span id="sCost">150</span>)</button>
    </div>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        let w, h, money = 0, units = [], particles = [];
        let dmgLvl = 1, spdLvl = 1;
        let mouse = { x: -1000, y: -1000 };
        
        const planets = [
            { name: "Меркурий", hp: 150, mhp: 150, sz: 50, col: "#888", rwd: 300 },
            { name: "Венера", hp: 600, mhp: 600, sz: 70, col: "#E3BB76", rwd: 800 },
            { name: "Земля", hp: 1500, mhp: 1500, sz: 80, col: "#2D5DA1", rwd: 2000 },
            { name: "Марс", hp: 3500, mhp: 3500, sz: 65, col: "#C1440E", rwd: 5000 },
            { name: "Юпитер", hp: 10000, mhp: 10000, sz: 120, col: "#D39C7E", rwd: 15000 }
        ];
        
        let pIdx = 0, uC = 50, dC = 100, sC = 150;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            if(!units.length) units.push(new Unit());
        }

        class Unit {
            constructor() {
                this.x = Math.random()*w; this.y = Math.random()*h;
                this.vx = 0; this.vy = 0;
            }
            update() {
                let dx = mouse.x - this.x, dy = mouse.y - this.y;
                let d = Math.hypot(dx, dy);
                let speedBase = 0.5 + (spdLvl * 0.1);
                
                if(d > 5) {
                    this.vx += dx/d * speedBase;
                    this.vy += dy/d * speedBase;
                }
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.93; this.vy *= 0.93;

                let pl = planets[pIdx];
                let pdx = w/2 - this.x, pdy = h/2 - this.y;
                let pd = Math.hypot(pdx, pdy);

                if(pd < pl.sz) {
                    pl.hp -= dmgLvl;
                    money += (1 + (dmgLvl * 0.1));
                    this.vx = -pdx/pd * 10; this.vy = -pdy/pd * 10;
                    if(particles.length < 50) spawnP(this.x, this.y, pl.col);
                    updateUI();
                }
            }
            draw() {
                ctx.fillStyle = "#fff";
                ctx.fillRect(this.x-1, this.y-1, 3, 3);
            }
        }

        function spawnP(x, y, col) {
            particles.push({x, y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, l:1, c:col});
        }

        function updateUI() {
            document.getElementById('money').innerText = Math.floor(money);
            document.getElementById('hpBar').style.width = (planets[pIdx].hp / planets[pIdx].mhp * 100) + "%";
            document.getElementById('uCost').innerText = uC;
            document.getElementById('dCost').innerText = dC;
            document.getElementById('sCost').innerText = sC;
            
            document.getElementById('buyUnit').disabled = money < uC;
            document.getElementById('buyDmg').disabled = money < dC;
            document.getElementById('buySpd').disabled = money < sC;
        }

        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.2)"; // Хвосты без лагов
            ctx.fillRect(0,0,w,h);
            
            let p = planets[pIdx];
            
            // Планета (Градиент вместо теней для скорости)
            let grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, p.sz);
            grad.addColorStop(0, p.col);
            grad.addColorStop(1, '#000');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(w/2, h/2, p.sz, 0, Math.PI*2); ctx.fill();

            if(p.hp <= 0) {
                money += p.rwd;
                pIdx = (pIdx + 1) % planets.length;
                planets[pIdx].hp = planets[pIdx].mhp;
                document.getElementById('planetName').innerText = planets[pIdx].name;
                updateUI();
            }

            units.forEach(u => { u.update(); u.draw(); });
            
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.l -= 0.05;
                if(p.l <= 0) particles.splice(i,1);
                ctx.fillStyle = p.c;
                ctx.fillRect(p.x, p.y, 1.5, 1.5);
            });

            requestAnimationFrame(draw);
        }

        document.getElementById('buyUnit').onclick = () => {
            if(money >= uC) { money -= uC; units.push(new Unit()); uC = Math.floor(uC * 1.5); updateUI(); }
        };
        document.getElementById('buyDmg').onclick = () => {
            if(money >= dC) { money -= dC; dmgLvl += 2; dC = Math.floor(dC * 2); updateUI(); }
        };
        document.getElementById('buySpd').onclick = () => {
            if(money >= sC) { money -= sC; spdLvl += 1; sC = Math.floor(sC * 1.8); updateUI(); }
        };

        const setM = e => { mouse.x = e.touches ? e.touches[0].clientX : e.clientX; mouse.y = e.touches ? e.touches[0].clientY : e.clientY; };
        window.addEventListener('mousemove', setM);
        window.addEventListener('touchmove', setM);
        window.onresize = init;
        init(); updateUI(); draw();
    </script>
</body>
</html>
