<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NESTOR COSMOS ENGINE</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: crosshair; }
        canvas { display: block; touch-action: none; }
        .ui {
            position: fixed; bottom: 20px; left: 20px;
            color: rgba(255,255,255,0.2); font-family: 'Courier New', monospace;
            font-size: 10px; pointer-events: none; text-transform: uppercase; line-height: 1.5;
        }
        .name-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.03); font-family: sans-serif;
            font-weight: 900; font-size: 20vw; pointer-events: none; z-index: -1;
        }
    </style>
</head>
<body>

    <div class="name-bg">NESTOR</div>
    <div class="ui">
        Нажми: Гравитация / Двигай: Искажение<br>
        Система активна: 1000+ объектов
    </div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let w, h, particles = [];
        const mouse = { x: -1000, y: -1000, down: false };

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 250; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    r: Math.random() * 2 + 1,
                    hue: Math.random() * 60 + 180 // Космические сине-фиолетовые тона
                });
            }
        }

        function draw() {
            // Создаем эффект затухания для шлейфов
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, w, h);

            particles.forEach((p, i) => {
                // Движение
                p.x += p.vx;
                p.y += p.vy;

                // Отскок от стен
                if (p.x < 0 || p.x > w) p.vx *= -1;
                if (p.y < 0 || p.y > h) p.vy *= -1;

                // Физика мыши
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 200) {
                    let force = (200 - dist) / 200;
                    if (mouse.down) {
                        // Притяжение (Черная дыра)
                        p.vx += dx / dist * force * 0.5;
                        p.vy += dy / dist * force * 0.5;
                    } else {
                        // Отталкивание
                        p.vx -= dx / dist * force * 2;
                        p.vy -= dy / dist * force * 2;
                    }
                }

                // Трение (чтобы частицы не разлетались слишком быстро)
                p.vx *= 0.98;
                p.vy *= 0.98;

                // Рисуем связи (созвездия)
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let d = Math.sqrt((p.x - p2.x)**2 + (p.y - p2.y)**2);
                    if (d < 100) {
                        ctx.strokeStyle = `hsla(${p.hue}, 50%, 50%, ${0.2 - d/500})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }

                // Рисуем саму звезду
                ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, 0.8)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        const up = (e) => {
            mouse.x = e.touches ? e.touches[0].clientX : e.clientX;
            mouse.y = e.touches ? e.touches[0].clientY : e.clientY;
        };

        window.addEventListener('mousemove', up);
        window.addEventListener('touchmove', up);
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('touchstart', (e) => { mouse.down = true; up(e); });
        window.addEventListener('mouseup', () => mouse.down = false);
        window.addEventListener('touchend', () => mouse.down = false);

        window.onresize = init;
        init();
        draw();
    </script>
</body>
</html>
