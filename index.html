<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NESTOR: OMNIVERSAL EATER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@300;600;900&display=swap');

        :root {
            --neon: #00f2ff;
            --warn: #ffcc00;
            --kill: #ff0044;
            --panel-bg: rgba(15, 20, 30, 0.8);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #020408; color: #fff;
            font-family: 'Exo 2', sans-serif; overflow: hidden;
            touch-action: none;
        }

        canvas { display: block; image-rendering: auto; }

        /* --- ФУТУРИСТИЧНИЙ ЗАКРУГЛЕНИЙ UI --- */
        .ui-main {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 100;
            padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; /* Твоє закруглення */
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,242,255,0.05);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 25px; align-self: center; width: 100%; max-width: 600px;
        }

        .stat { text-align: center; }
        .stat-label { font-size: 10px; font-weight: 600; opacity: 0.5; letter-spacing: 2px; }
        .stat-value { font-size: 20px; font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); }

        .planet-hud {
            text-align: center; margin-top: 10px;
        }
        .hp-box {
            width: 250px; height: 10px; background: rgba(255,255,255,0.05);
            border-radius: 20px; margin: 8px auto; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
        }
        .hp-bar {
            height: 100%; width: 100%; background: linear-gradient(90deg, var(--kill), var(--neon));
            transition: width 0.3s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .controls {
            display: flex; gap: 12px; justify-content: center;
            padding: 15px; width: 100%; max-width: 500px; align-self: center;
        }

        .btn {
            pointer-events: auto; flex: 1;
            padding: 12px 5px; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
        }
        .btn:active { transform: scale(0.92) translateY(2px); background: var(--neon); }
        .btn:active span { color: #000; }
        .btn:disabled { opacity: 0.2; filter: grayscale(1); transform: scale(1) !important; }

        .btn-n { font-size: 9px; font-weight: 800; opacity: 0.7; }
        .btn-p { font-size: 14px; font-weight: 900; color: var(--warn); }

        /* Ефекти */
        #flash {
            position: fixed; inset: 0; pointer-events: none; z-index: 200;
            background: #fff; opacity: 0; transition: opacity 0.1s;
        }

        .damage-popup {
            position: absolute; color: var(--kill); font-weight: 900;
            pointer-events: none; animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="flash"></div>
<div class="ui-main">
    <div class="header glass">
        <div class="stat">
            <div class="stat-label">NEST_COINS</div>
            <div class="stat-value" id="cash">0</div>
        </div>
        <div class="planet-hud">
            <div id="p-name" style="font-weight: 900; font-size: 14px; letter-spacing: 3px;">VOID</div>
            <div class="hp-box"><div id="hp-bar" class="hp-bar"></div></div>
        </div>
        <div class="stat">
            <div class="stat-label">SWARM_LVL</div>
            <div class="stat-value" id="s-count">1</div>
        </div>
    </div>

    <div class="controls glass">
        <button id="buy-s" class="btn">
            <span class="btn-n">EVOLVE SWARM</span>
            <span class="btn-p" id="p-s">100</span>
        </button>
        <button id="buy-d" class="btn">
            <span class="btn-n">PLASMA JAW</span>
            <span class="btn-p" id="p-d">250</span>
        </button>
        <button id="buy-v" class="btn">
            <span class="btn-n">WARP DRIVE</span>
            <span class="btn-p" id="p-v">500</span>
        </button>
    </div>
</div>

<canvas id="stage"></canvas>

<script>
/**
 * NESTOR: OMNIVERSAL EATER - HIGH PERFORMANCE ENGINE
 */

// 1. SOUND ENGINE (Web Audio API)
const AudioEngine = {
    ctx: null,
    init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(freq, type, dur, vol) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    },
    hit() { this.play(Rnd(100, 200), 'square', 0.1, 0.05); },
    buy() { this.play(800, 'sine', 0.3, 0.1); },
    boom() { this.play(60, 'sawtooth', 0.8, 0.2); }
};

// 2. CORE SETUP
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
let w, h, cx, cy;
const Rnd = (m, x) => Math.random() * (x - m) + m;

const State = {
    money: 0,
    pIdx: 0,
    isDown: false,
    mPos: { x: 0, y: 0 },
    shake: 0,
    swarm: [],
    parts: [],
    popups: []
};

const Up = {
    sLvl: 1, dLvl: 1, vLvl: 1,
    costS: 100, costD: 250, costV: 500
};

const Planets = [
    { n: "PRISMA", hp: 1000, max: 1000, r: 80, c: '#0ff', s: '#055' },
    { n: "NEON-X", hp: 5000, max: 5000, r: 110, c: '#f0f', s: '#505' },
    { n: "ORBITAL", hp: 15000, max: 15000, r: 140, c: '#ff0', s: '#550' },
    { n: "VOID-CORE", hp: 50000, max: 50000, r: 130, c: '#fff', s: '#222' }
];

// 3. REAPER CLASS (The "Eater")
class Reaper {
    constructor() {
        this.x = Rnd(0, w); this.y = Rnd(0, h);
        this.vx = 0; this.vy = 0;
        this.angle = 0;
        this.size = 3;
        this.color = varColor('--neon');
        this.energy = 0;
    }

    update() {
        let tx = State.isDown ? State.mPos.x : cx + Math.cos(Date.now()*0.002) * 150;
        let ty = State.isDown ? State.mPos.y : cy + Math.sin(Date.now()*0.002) * 150;

        let dx = tx - this.x; let dy = ty - this.y;
        let d = Math.hypot(dx, dy);
        
        // Математика рою
        let speed = (State.isDown ? 0.8 : 0.3) + (Up.vLvl * 0.1);
        this.vx += (dx / d) * speed;
        this.vy += (dy / d) * speed;
        this.vx *= 0.94; this.vy *= 0.94;
        this.x += this.vx; this.y += this.vy;

        this.angle = Math.atan2(this.vy, this.vx);

        // Контакт з планетою
        let p = Planets[State.pIdx];
        let pd = Math.hypot(cx - this.x, cy - this.y);

        if (pd < p.r + 5) {
            let dmg = Up.dLvl * (State.isDown ? 2 : 1);
            p.hp -= dmg;
            State.money += dmg * 0.2;
            this.vx = -(cx - this.x) / pd * 8;
            this.vy = -(cy - this.y) / pd * 8;
            
            if (Math.random() > 0.8) {
                State.parts.push(new Particle(this.x, this.y, p.c));
                AudioEngine.hit();
            }
            if (State.isDown) State.shake = 3;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // Тіло жнеця (Еволюціонує візуально)
        ctx.fillStyle = State.isDown ? varColor('--kill') : varColor('--neon');
        
        // Малюємо "зуби" або лазери в залежності від рівня
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-6, -5);
        ctx.lineTo(-6, 5);
        ctx.fill();
        
        if (Up.dLvl > 5) { // Ефект Plasma Jaw
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
            ctx.strokeRect(-8, -2, 4, 4);
        }
        
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, c) {
        this.x = x; this.y = y; this.c = c;
        this.vx = Rnd(-3, 3); this.vy = Rnd(-3, 3);
        this.l = 1.0;
    }
    update() { this.x += this.vx; this.y += this.vy; this.l -= 0.03; }
    draw() {
        ctx.globalAlpha = this.l; ctx.fillStyle = this.c;
        ctx.fillRect(this.x, this.y, 2, 2);
    }
}

// 4. ENGINE CORE
function init() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w / 2; cy = h / 2;
    if (State.swarm.length === 0) {
        for(let i=0; i<8; i++) State.swarm.push(new Reaper());
    }
}

function drawPlanet() {
    let p = Planets[State.pIdx];
    
    // Оптимізований рендер
    ctx.shadowBlur = State.isDown ? 20 : 0;
    ctx.shadowColor = p.c;

    let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, p.r);
    g.addColorStop(0, p.c); g.addColorStop(1, p.s);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, p.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Деталі (Кратери)
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for(let i=0; i<5; i++) {
        ctx.beginPath();
        ctx.arc(cx + Math.cos(i)*p.r*0.5, cy + Math.sin(i)*p.r*0.5, p.r*0.2, 0, Math.PI*2);
        ctx.fill();
    }
}

function loop() {
    ctx.fillStyle = '#020408';
    ctx.fillRect(0, 0, w, h);

    if (State.shake > 0.1) {
        ctx.save();
        ctx.translate(Rnd(-State.shake, State.shake), Rnd(-State.shake, State.shake));
        State.shake *= 0.9;
    }

    // Зірки
    ctx.fillStyle = '#111';
    for(let i=0; i<20; i++) ctx.fillRect((i*150)%w, (i*230)%h, 2, 2);

    drawPlanet();

    // Смерть планети
    if (Planets[State.pIdx].hp <= 0) {
        AudioEngine.boom();
        State.money += Planets[State.pIdx].max;
        State.shake = 15;
        State.pIdx = (State.pIdx + 1) % Planets.length;
        Planets[State.pIdx].hp = Planets[State.pIdx].max;
        document.getElementById('flash').style.opacity = 0.5;
        setTimeout(() => document.getElementById('flash').style.opacity = 0, 100);
    }

    State.swarm.forEach(r => { r.update(); r.draw(); });
    
    for (let i = State.parts.length - 1; i >= 0; i--) {
        State.parts[i].update(); State.parts[i].draw();
        if (State.parts[i].l <= 0) State.parts.splice(i, 1);
    }

    if (State.shake > 0.1) ctx.restore();

    updateUI();
    requestAnimationFrame(loop);
}

function updateUI() {
    document.getElementById('cash').innerText = Math.floor(State.money);
    document.getElementById('s-count').innerText = State.swarm.length;
    document.getElementById('p-name').innerText = Planets[State.pIdx].n;
    
    let p = Planets[State.pIdx];
    document.getElementById('hp-bar').style.width = (p.hp / p.max * 100) + "%";

    document.getElementById('p-s').innerText = Up.costS;
    document.getElementById('p-d').innerText = Up.costD;
    document.getElementById('p-v').innerText = Up.costV;

    document.getElementById('buy-s').disabled = State.money < Up.costS;
    document.getElementById('buy-d').disabled = State.money < Up.costD;
    document.getElementById('buy-v').disabled = State.money < Up.costV;
}

// 5. EVENTS
const varColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const inputStart = (e) => {
    if (!AudioEngine.ctx) AudioEngine.init();
    State.isDown = true; inputMove(e);
};
const inputMove = (e) => {
    let t = e.touches ? e.touches[0] : e;
    State.mPos.x = t.clientX; State.mPos.y = t.clientY;
};

window.addEventListener('mousedown', inputStart);
window.addEventListener('touchstart', inputStart);
window.addEventListener('mousemove', inputMove);
window.addEventListener('touchmove', (e) => { inputMove(e); e.preventDefault(); }, {passive:false});
window.addEventListener('mouseup', () => State.isDown = false);
window.addEventListener('touchend', () => State.isDown = false);

document.getElementById('buy-s').onclick = () => {
    if(State.money >= Up.costS) {
        State.money -= Up.costS; Up.costS *= 2; Up.sLvl++;
        for(let i=0; i<5; i++) State.swarm.push(new Reaper());
        AudioEngine.buy();
    }
};
document.getElementById('buy-d').onclick = () => {
    if(State.money >= Up.costD) {
        State.money -= Up.costD; Up.costD *= 2.5; Up.dLvl += 2;
        AudioEngine.buy();
    }
};
document.getElementById('buy-v').onclick = () => {
    if(State.money >= Up.costV) {
        State.money -= Up.costV; Up.costV *= 3; Up.vLvl++;
        AudioEngine.buy();
    }
};

window.onresize = init;
init(); loop();

/**
 * ОПТИМІЗАЦІЯ ЗАВЕРШЕНА. 
 * КОД СТРУКТУРОВАНО НА МОДУЛІ.
 * ДОДАНО ЗВУКОВИЙ СИНТЕЗАТОР.
 * КІЛЬКІСТЬ ОБ'ЄКТІВ КОНТРОЛЬОВАНА.
 * ПРИЄМНОЇ ГРИ, НЕСТОРЕ!
 */
</script>
</body>
</html>
