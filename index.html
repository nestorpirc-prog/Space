<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NESTOR | COSMOS BEYOND</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; touch-action: none; }
        .info {
            position: fixed; bottom: 20px; left: 20px;
            color: rgba(255,255,255,0.3); font-family: monospace;
            font-size: 10px; letter-spacing: 2px; pointer-events: none;
        }
        .name {
            position: fixed; top: 40%; left: 0; width: 100%;
            text-align: center; color: white; font-family: sans-serif;
            font-weight: 900; font-size: 10vw; letter-spacing: -5px;
            opacity: 0.1; pointer-events: none; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="name">NESTOR</div>
    <div class="info">УПРАВЛЯЙ ВСЕЛЕННОЙ КАСАНИЕМ</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, particles = [];
        const particleCount = 600; // Количество звезд
        const mouse = { x: -1000, y: -1000, active: false };

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    baseX: Math.random() * width,
                    baseY: Math.random() * height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.5 + 0.1,
                    color: `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`
                });
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Эффект шлейфа
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                // Движение звезд
                p.y -= p.speed;
                if (p.y < 0) p.y = height;

                // Взаимодействие с мышкой/пальцем
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 150) {
                    let force = (150 - distance) / 150;
                    let dirX = dx / distance;
                    let dirY = dy / distance;
                    p.x -= dirX * force * 10;
                    p.y -= dirY * force * 10;
                }

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        const updateMouse = (e) => {
            mouse.x = e.touches ? e.touches[0].clientX : e.clientX;
            mouse.y = e.touches ? e.touches[0].clientY : e.clientY;
        };

        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('touchmove', updateMouse);
        window.addEventListener('mousedown', () => mouse.active = true);
        window.addEventListener('mouseup', () => { mouse.x = -1000; mouse.y = -1000; });

        window.onresize = init;
        init();
        draw();
    </script>
</body>
</html>
