<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NESTOR: PLANET EATER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background: #000; color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .ui { position: fixed; z-index: 10; pointer-events: none; width: 100%; padding: 20px; box-sizing: border-box; }
        .shop-btn { 
            pointer-events: auto; background: rgba(255,255,255,0.1); 
            border: 1px solid #fff; padding: 10px 20px; cursor: pointer;
            transition: 0.3s; font-size: 12px;
        }
        .shop-btn:hover { background: #fff; color: #000; }
        .shop-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .planet-info { text-align: center; width: 100%; top: 20%; position: fixed; }
    </style>
</head>
<body>

    <div class="ui flex justify-between items-start">
        <div>
            <div class="text-[10px] opacity-50 uppercase">Баланс</div>
            <div class="text-2xl font-black text-yellow-400">$<span id="money">0</span></div>
        </div>
        <button id="buyBtn" class="shop-btn">КУПИТЬ ЖНЕЦА ($50)</button>
    </div>

    <div class="planet-info">
        <div id="planetName" class="text-3xl font-black tracking-[0.3em] uppercase mb-2">Меркурий</div>
        <div class="w-48 h-1 bg-white/20 mx-auto overflow-hidden">
            <div id="hpBar" class="h-full bg-red-600 transition-all duration-100" style="width: 100%"></div>
        </div>
    </div>

    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const moneyEl = document.getElementById('money');
        const buyBtn = document.getElementById('buyBtn');
        const hpBar = document.getElementById('hpBar');
        const planetNameEl = document.getElementById('planetName');

        let w, h, money = 0, units = [], particles = [];
        let mouse = { x: -1000, y: -1000 };
        
        const planets = [
            { name: "Меркурий", hp: 100, maxHp: 100, size: 40, color: "#888", reward: 150 },
            { name: "Венера", hp: 300, maxHp: 300, size: 60, color: "#e3bb76", reward: 400 },
            { name: "Земля", hp: 800, maxHp: 800, size: 65, color: "#2271b3", reward: 1000 },
            { name: "Марс", hp: 1500, maxHp: 1500, size: 55, color: "#e27b58", reward: 2500 },
            { name: "Юпитер", hp: 5000, maxHp: 5000, size: 100, color: "#d39c7e", reward: 7000 }
        ];
        let currentPlanetIdx = 0;
        let unitCost = 50;

        function init() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        class Unit {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.vx = 0; this.vy = 0;
                this.r = 3;
            }
            update() {
                // Тяга к пальцу
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let dist = Math.hypot(dx, dy);
                if(dist > 5) {
                    this.vx += dx / dist * 0.5;
                    this.vy += dy / dist * 0.5;
                }
                
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.95; this.vy *= 0.95;

                // Проверка столкновения с планетой
                let pdx = w/2 - this.x;
                let pdy = h/2 - this.y;
                let pDist = Math.hypot(pdx, pdy);
                let planet = planets[currentPlanetIdx];

                if(pDist < planet.size) {
                    planet.hp -= 1;
                    this.vx = -pdx / pDist * 10; // Отскок
                    this.vy = -pdy / pDist * 10;
                    createParticles(this.x, this.y, planet.color);
                }
            }
            draw() {
                ctx.fillStyle = "#fff";
                ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function createParticles(x, y, col) {
            for(let i=0; i<3; i++) {
                particles.push({
                    x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                    life: 1, col: col
                });
            }
        }

        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fillRect(0,0,w,h);
            
            let planet = planets[currentPlanetIdx];

            // Отрисовка планеты
            ctx.fillStyle = planet.color;
            ctx.shadowBlur = 20; ctx.shadowColor = planet.color;
            ctx.beginPath(); ctx.arc(w/2, h/2, planet.size, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Логика HP
            hpBar.style.width = (planet.hp / planet.maxHp * 100) + "%";
            if(planet.hp <= 0) {
                money += planet.reward;
                moneyEl.innerText = money;
                currentPlanetIdx = (currentPlanetIdx + 1) % planets.length;
                planets[currentPlanetIdx].hp = planets[currentPlanetIdx].maxHp;
                planetNameEl.innerText = planets[currentPlanetIdx].name;
            }

            units.forEach(u => { u.update(); u.draw(); });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) particles.splice(i,1);
                ctx.fillStyle = p.col; ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
            ctx.globalAlpha = 1;

            requestAnimationFrame(draw);
        }

        buyBtn.onclick = () => {
            if(money >= unitCost) {
                money -= unitCost;
                moneyEl.innerText = money;
                units.push(new Unit());
                unitCost = Math.floor(unitCost * 1.5);
                buyBtn.innerText = `КУПИТЬ ЖНЕЦА ($${unitCost})`;
            }
        };

        // Старт: даем одного бесплатного для начала
        setTimeout(() => { units.push(new Unit()); }, 500);

        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.onresize = init;
        init(); draw();
    </script>
</body>
</html>
