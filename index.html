<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NESTOR | QUANTUM STORM</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: none; }
        canvas { display: block; touch-action: none; }
        .hud {
            position: fixed; top: 20px; right: 20px;
            color: rgba(255, 255, 255, 0.15); font-family: monospace;
            font-size: 10px; pointer-events: none; text-transform: uppercase; text-align: right;
        }
        .name {
            position: fixed; bottom: 40px; left: 40px;
            color: white; font-family: sans-serif;
            font-weight: 900; font-size: 8vw; letter-spacing: -3px;
            opacity: 0.05; pointer-events: none; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="name">NESTOR</div>
    <div class="hud">
        Quantum Storm | Активно: 400<br>
        Тап: Взрыв / Движение: Искажение
    </div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let width, height, particles = [];
        const particleCount = 400; // Оптимальное количество для производительности
        const mouse = { x: -1000, y: -1000, down: false };

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 1, // Медленнее, для плавности
                    vy: (Math.random() - 0.5) * 1,
                    size: Math.random() * 2 + 1,
                    hue: 180 + Math.random() * 60 // Бирюзово-фиолетовые тона
                });
            }
        }

        function draw() {
            // Фон с плавным затуханием (Эффект шлейфа)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Оптимизация: используем эффект свечения через "Композицию"
            ctx.globalCompositeOperation = 'lighter'; // Смешивает цвета, добавляя свет

            particles.forEach(p => {
                // Движение
                p.x += p.vx;
                p.y += p.vy;

                // Отскок от стен
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                // Физика мыши
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let dist = Math.hypot(dx, dy); // Быстрое расстояние

                if (dist < 150) {
                    let force = (150 - dist) / 150;
                    if (mouse.down) {
                        // Притяжение (Грав-колодец)
                        p.vx += dx / dist * force * 0.8;
                        p.vy += dy / dist * force * 0.8;
                    } else {
                        // Искажение (Палец «гнет» пространство)
                        p.vx -= dx / dist * force * 2;
                        p.vy -= dy / dist * force * 2;
                        
                        // Добавляем креативность: линии только рядом с пальцем
                        ctx.strokeStyle = `hsla(${p.hue}, 100%, 80%, ${force/2})`;
                        ctx.lineWidth = 1 * force;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.stroke();
                    }
                }

                // Трение (плавное замедление)
                p.vx *= 0.99;
                p.vy *= 0.99;

                // Рисуем саму звезду со свечением
                ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, 1)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Восстанавливаем стандартную композицию
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(draw);
        }

        const updateMouse = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = clientX;
            mouse.y = clientY;
        };

        const tapExplosion = () => {
            particles.forEach(p => {
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let dist = Math.hypot(dx, dy);
                if (dist < 100) {
                    let force = (100 - dist) / 100;
                    // Резкий импульс в стороны
                    p.vx = -dx / dist * force * 15;
                    p.vy = -dy / dist * force * 15;
                }
            });
        };

        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('touchmove', updateMouse);
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('touchstart', (e) => { updateMouse(e); mouse.down = true; tapExplosion(); });
        window.addEventListener('mouseup', () => mouse.down = false);
        window.addEventListener('touchend', () => mouse.down = false);
        window.addEventListener('click', tapExplosion);

        window.onresize = init;
        init();
        draw();
    </script>
</body>
</html>
